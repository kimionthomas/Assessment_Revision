            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-container { width: 100%; max-width: 750px; background: var(--surface); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        header { margin-bottom: 20px; text-align: center; }
        h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 8px; }
        .meta-info { display: flex; justify-content: space-between; color: var(--text-light); font-size: 0.9rem; margin-bottom: 10px; }
        .progress-bar-container { width: 100%; height: 6px; background-color: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background-color: var(--primary); transition: width 0.2s ease; }
        .quiz-card { margin-bottom: 20px; }
        .section-tag { display: inline-block; padding: 4px 10px; background-color: #dbeafe; color: var(--primary); border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; }
        .options-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn { background-color: var(--surface); border: 2px solid var(--border); padding: 14px 18px; border-radius: 6px; text-align: left; font-size: 0.95rem; cursor: pointer; transition: all 0.15s ease; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #eff6ff; }
        .option-btn.correct { background-color: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; font-weight: 600; }
        .option-btn.wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #7f1d1d; }
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 0.95rem; display: none; }
        .feedback-box.correct { display: block; background-color: #dcfce7; color: #14532d; }
        .feedback-box.wrong { display: block; background-color: #fee2e2; color: #7f1d1d; }
        .control-panel { display: flex; justify-content: flex-end; margin-top: 15px; }
        .next-btn { background-color: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: none; }
        .next-btn:hover { background-color: var(--primary-hover); }
        .results-screen { text-align: center; display: none; }
        .score-display { font-size: 2.5rem; font-weight: 700; color: var(--primary); margin: 15px 0; }
        .restart-btn { background-color: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
    </style>
</head>

        let currentQuestionIndex = 0;
        let runningScore = 0;
        let selectedOptionThisTurn = false;

        function initGame() {
            currentQuestionIndex = 0;
            runningScore = 0;
            document.getElementById("quiz-space").style.display = "block";
            document.getElementById("results-screen").style.display = "none";
            renderQuestion();
        }

        function renderQuestion() {
            selectedOptionThisTurn = false;
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("feedback-box").style.display = "none";
            document.getElementById("feedback-box").className = "feedback-box";
            
            let activeQ = questionBank[currentQuestionIndex];
            
            document.getElementById("question-counter").innerText = `Question ${currentQuestionIndex + 1} of ${questionBank.length}`;
            document.getElementById("score-counter").innerText = `Score: ${runningScore}`;
            
            let calculatedProgress = (currentQuestionIndex / questionBank.length) * 100;
            document.getElementById("progress-bar").style.width = `${calculatedProgress}%`;
            
            document.getElementById("section-tag").innerText = activeQ.section;
            document.getElementById("question-text").innerText = activeQ.question;
            
            let optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";
            
            activeQ.options.forEach((optionString, index) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = optionString;
                btn.onclick = function() { evaluateChoice(this, index); };
                optionsContainer.appendChild(btn);
            });
        }

        function evaluateChoice(selectedBtn, pickedIndex) {
            if (selectedOptionThisTurn) return;
            selectedOptionThisTurn = true;
            
            let activeQ = questionBank[currentQuestionIndex];
            let allOptionButtons = document.getElementsByClassName("option-btn");
            let feedbackElement = document.getElementById("feedback-box");
            
            for (let i = 0; i < allOptionButtons.length; i++) {
                allOptionButtons[i].disabled = true;
            }
            
            if (pickedIndex === activeQ.answer) {
                selectedBtn.classList.add("correct");
                feedbackElement.innerText = "Correct! " + activeQ.reason;
                feedbackElement.className = "feedback-box correct";
                runningScore++;
                document.getElementById("score-counter").innerText = `Score: ${runningScore}`;
            } else {
                selectedBtn.classList.add("wrong");
                allOptionButtons[activeQ.answer].classList.add("correct");
                feedbackElement.innerText = "Incorrect. " + activeQ.reason;
                feedbackElement.className = "feedback-box wrong";
            }
            
            document.getElementById("next-btn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questionBank.length) {
                renderQuestion();
            } else {
                showResultsScreen();
            }
        }

        function showResultsScreen() {
            document.getElementById("quiz-space").style.display = "none";
            document.getElementById("results-screen").style.display = "block";
            document.getElementById("score-display").innerText = `${runningScore} / ${questionBank.length}`;
            
            let trackingPercentage = (runningScore / questionBank.length) * 100;
            let performanceMessage = "";
            
            if (trackingPercentage === 100) {
                performanceMessage = "Exceptional performance! Absolute mastery of every single assessment objective.";
            } else if (trackingPercentage >= 80) {
                performanceMessage = "Fantastic job! Great understanding of printers, data validation, and information security principles.";
            } else if (trackingPercentage >= 50) {
                performanceMessage = "Passable work! Consider reviewing database relationships and validation checks to score higher.";
            } else {
                performanceMessage = "Needs revision. Re-read the assessment guidelines and try again to build up your IT knowledge.";
            }
            
            document.getElementById("performance-msg").innerText = performanceMessage;
        }

        function restartGame() {
            initGame();
        }

        // Safer explicit load hook execution trigger
        if (document.readyState === "complete" || document.readyState === "interactive") {
            setTimeout(initGame, 1);
        } else {
            document.addEventListener("DOMContentLoaded", initGame);
        }
    </script>
</body>
</html>
